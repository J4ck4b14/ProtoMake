name: Feature proposal
description: Propose a focused creator workflow or engine capability.
title: '[Feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Creator problem
      description: Describe the concrete workflow or limitation before proposing an API.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Compatibility, portability, or migration constraints
